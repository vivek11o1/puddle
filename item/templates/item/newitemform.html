{% extends "core/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-green-200 shadow-lg rounded-xl p-6">
    <h1 class="text-2xl font-semibold mb-5 text-gray-800">{{ title }}</h1>

    <form method="post" action='.' enctype="multipart/form-data" >

        {% csrf_token %}

        <div class="space-y-4">
            {{form.as_p}}
        </div>

        {% if form.errors or form.non_field_eorros %}
        <div class="mb-3 p-6 bg-red-200 rounded-xl">
            {% for field in form %}
                {{ form.errors }}
            {% endfor %}

            {{ form.non_field_errors }}
        </div>
        {% endif %}

         <button class="mt-6  py-4 px-8 rounded-xl bg-teal-500 hover:bg-teal-700 font-semibol text-white">Submit</button>
    </form>

       

</div>
{% endblock %}
